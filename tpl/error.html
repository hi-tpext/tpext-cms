{if condition="$error_code >= 500"}<!--__error_5xx__-->{/if}
<style>
.error-page{max-width:640px;margin:60px auto;text-align:center;padding:40px 20px;}
.error-code{font-size:96px;font-weight:800;line-height:1.1;color:var(--primary,#2b5ce6);}
.error-title{font-size:24px;color:var(--navy-900,#0e1a30);margin:16px 0 8px;}
.error-msg{color:#64748b;margin:0 0 28px;word-break:break-all;}
.error-actions{display:flex;gap:12px;justify-content:center;}
.error-btn{display:inline-block;padding:10px 28px;border-radius:8px;background:var(--primary,#2b5ce6);color:#fff;text-decoration:none;}
.error-btn:hover{opacity:.9;}
.error-btn.ghost{background:transparent;color:var(--primary,#2b5ce6);border:1px solid var(--primary,#2b5ce6);}
</style>
<div class="error-page">
    <div class="error-code">{$error_code}</div>
    <h1 class="error-title">{eq name="error_code" value="404"}页面不存在{else /}页面出错了{/eq}</h1>
    <p class="error-msg">{$error_msg}</p>
    <div class="error-actions">
        <a class="error-btn" href="@site_home@">返回首页</a>
        <a class="error-btn ghost" href="javascript:history.back();">返回上一页</a>
    </div>
</div>
