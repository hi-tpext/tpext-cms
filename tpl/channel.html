<!--文章列表:按栏目(示例)-->
<div class="breadcrumb">
    <span class="breadcrumb-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 11l8-7 8 7v8a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19v-8z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
        </svg>
    </span>
    <a href="@site_home@">首页</a>
    {channel@parents}
    <span class="sep">›</span><a href="{$channel.url}">{$channel.name}</a>
    {/channel@parents}
</div>
<!--当前栏目：{$channel.name}-->
<div class="list">
    {content@list}
    <article class="list-item">
        <div class="item-head">
            <h3 class="item-title">
                <a target="_blank" href="{$content.url}">{$content.title}</a>
                {if $content.is_top==1}
                <b class="badge badge-top">置顶</b>
                {/if}
                {if $content.is_hot==1}
                <b class="badge badge-hot">热</b>
                {/if}
            </h3>
            <span class="item-date">{$content.date}</span>
        </div>
        {if $content.description}
        <p class="item-desc">{$content.description}</p>
        {/if}
    </article>
    {/content@list}
</div>
