<header class="site-header">
    <!--工具条-->
    <div class="topbar">
        <div class="main-container topbar-inner">
            <span class="topbar-date"></span>
            <div class="topbar-links">
                <a href="@site_home@about.html">关于我们</a>
                <a href="@site_home@contact.html">联系我们</a>
                <a href="@site_home@e/demo.html">模板演示</a>
            </div>
        </div>
    </div>
    <!--站头：LOGO + 搜索-->
    <div class="masthead">
        <div class="main-container masthead-inner">
            <a class="site-logo" href="@site_home@">
                <span class="logo-mark">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5v-13z" stroke="currentColor" stroke-width="1.8" />
                        <path d="M7.5 8.5h6M7.5 12h9M7.5 15.5h9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                        <path d="M16.5 8.5h.01" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
                    </svg>
                </span>
                <span class="logo-text">{$__wconf__.name}</span>
            </a>
            <div class="search-box">
                <input type="text" placeholder="输入关键字，回车搜索" value="{$kwd|default=''}" class="search-input">
                <button class="search-btn">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="2" />
                        <path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    </svg>搜索
                </button>
            </div>
        </div>
    </div>
    <!--主导航：栏目列表或内容详情时，会有$channel_id变量，可以此判断当前栏目-->
    <!--is_navi=1条件表示只显示栏目中开启[顶部导航]选项的栏目，pid=0表示只显示顶级栏目-->
    <nav class="main-nav">
        <div class="main-container">
            <ul class="top-navi">
                <li class="navi-item {if empty($channel_id) && empty($content_id)}active{/if}"><a href="@site_home@">首页</a></li>
                {channel@list pid="0" where="is_navi=1" num="20" cache="navi,600"}
                <li class="navi-item {if !empty($channel_id) && $channel_id==$channel.id}active{/if}">
                    <a href="{$channel.url}">{$channel.name}</a>
                </li>
                {/channel@list}
            </ul>
        </div>
    </nav>
</header>
